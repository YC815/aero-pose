[project]
name = "aero"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YC815", email = "yushun@chen.zone" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
    "fastapi>=0.143.2",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
orbbec = [
    "pyorbbecsdk2>=2.1.2",
]

[project.scripts]
aero = "aero.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
